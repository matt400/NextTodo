opencollection: 1.0.0
info:
  name: NextTodo
config:
  environments:
    - name: NextTodo
      variables: []
items:
  - info:
      name: '[Pomo] Start event'
      type: http
      seq: 14
    http:
      method: POST
      url: http://localhost:3000/api/task/startPomo
      body:
        type: json
        data: '{ "task_id": 1, "duration": 3600 }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[Task] Add new'
      type: http
      seq: 10
    http:
      method: POST
      url: http://localhost:3000/api/task
      body:
        type: json
        data: '{ "task_name": "First task", "task_desc": "This is a long description." }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[Task] Get one or all'
      type: http
      seq: 9
    http:
      method: GET
      url: http://localhost:3000/api/task?single=true&task_id=1
      params:
        - name: single
          value: 'true'
          type: query
        - name: task_id
          value: '1'
          type: query
      body:
        type: json
        data: ''
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[Task] Modify data'
      type: http
      seq: 11
    http:
      method: PATCH
      url: http://localhost:3000/api/task
      body:
        type: json
        data: '{ "task_id": "1", "data": { "isFinished": "true", "taskName": "Task 2" } }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[Task] Remove'
      type: http
      seq: 12
    http:
      method: DELETE
      url: http://localhost:3000/api/task
      body:
        type: json
        data: '{ "task_id": [1,2,3] }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Change password'
      type: http
      seq: 6
    http:
      method: POST
      url: http://localhost:3000/api/user/me/change-password
      body:
        type: json
        data: '{ "current_password": "ADa%234AasdG", "new_password": "ADa%234AasdG", "confirm_password": "testtest"}'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Login'
      type: http
      seq: 3
    http:
      method: POST
      url: http://localhost:3000/api/auth/login
      body:
        type: json
        data: '{ "email": "admin@example.io", "password": "admin" }  '
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Logout'
      type: http
      seq: 5
    http:
      method: POST
      url: http://localhost:3000/api/user/logout
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Me'
      type: http
      seq: 1
    http:
      method: GET
      url: http://localhost:3000/api/user/me
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Modify data'
      type: http
      seq: 7
    http:
      method: PATCH
      url: http://localhost:3000/api/user/me
      body:
        type: json
        data: '{ "isActive": "false" }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Register'
      type: http
      seq: 4
    http:
      method: POST
      url: http://localhost:3000/api/auth/register
      body:
        type: json
        data: |-
          { 
            "username": "admin2",
            "email": "admin@example.com",
            "password": "123aAgsfgs%",
            "confirm_password": "123aAgsfgs%"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[User] Remove'
      type: http
      seq: 8
    http:
      method: DELETE
      url: http://localhost:3000/api/user/me
      body:
        type: json
        data: '{ "email": "admin@example.io" }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[Pomo] Get event'
      type: http
      seq: 13
    http:
      method: POST
      url: http://localhost:3000/api/task/getPomo
      body:
        type: json
        data: '{ "task_id": 1 }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: '[Pomo] Pause event'
      type: http
      seq: 15
    http:
      method: POST
      url: http://localhost:3000/api/task/pausePomo
      body:
        type: json
        data: '{ "pomo_id": "id_here", "task_id": 1, "elapsed": 3000 }'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
bundled: true
extensions:
